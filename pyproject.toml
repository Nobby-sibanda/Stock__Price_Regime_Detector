[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stock-regime-detector"
version = "1.0.0"
description = "Unsupervised stock market regime detection using HMM and KMeans"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
dev  = ["pytest>=7.4", "pytest-cov"]

[project.scripts]
stock-regime-detector = "stock_regime_detector.__main__:main"

[tool.setuptools.package-dir]
"stock_regime_detector" = "."

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
